services:
  api:
    build: .
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-net
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - taskflow-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  taskflow-net:
    driver: bridge
